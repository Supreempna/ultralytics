# FLS Detection Dataset - YOLO format
# Forward-Looking Sonar object detection
# Classes: victim, boat, plane

# Paths (relative to this yaml file, or absolute)
# Path: images和label就在同一目录下，且images和labels文件夹结构相同，可直接不行path，直接使用images/train和images/val
train: images/train
val: images/val

# Number of classes
nc: 3

# Class names
names:
  0: victim
  1: boat
  2: plane

# YOLO26n-NAFNet-SpeckleNoise: end-to-end sonar image degradation + denoising pipeline
#
# Pipeline: Input → SpeckleNoise (synthetic degradation) → NAFNet (denoising) → YOLO Backbone → Head
#
# Training mode:
#   Clean image → Gamma multiplicative noise + optional Gaussian additive noise
#   → NAFNet learns to remove the synthetic noise → standard YOLO backbone
#
# Inference mode (model.eval()):
#   SpeckleNoise acts as pass-through (no noise added)
#   → NAFNet denoises pre-existing real sonar noise → backbone
#
# Speckle noise model (FLS sonar): Inoise = Iclean * N
#   where N ~ Gamma(L, 1/L), E[N]=1, Var[N]=1/L
#   Lower L = stronger speckle noise
#
# References:
#   NAFNet: https://github.com/megvii-research/NAFNet
#   FLS degradation: IEEE Trans. Signal Process. / Underwater Acoustic Modeling (CRC Press)

# Parameters
nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants, i.e. 'model=yolo26n-NAFNet-SpeckleNoise.yaml' will call with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: ~270 layers, ~2.58M parameters

# YOLO26n-NAFNet-SpeckleNoise backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, SpeckleNoise, [3, 1, False, 0.0]] # 0-speckle: c2=3, L=1, no additive noise
  - [-1, 1, NAFNet, [3, 16, 2]] # 1-NAFNet: c2=3, 16 hidden, 2 NAFBlocks
  - [-1, 1, Conv, [64, 3, 2]] # 2-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 3-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 5-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 7-P4/16
  - [-1, 2, C3k2, [512, True]] # 8
  - [-1, 1, Conv, [1024, 3, 2]] # 9-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 11
  - [-1, 2, C2PSA, [1024]] # 12

# YOLO26n-NAFNet-SpeckleNoise head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 8], 1, Concat, [1]] # cat backbone P4 (layer 8)
  - [-1, 2, C3k2, [512, True]] # 15

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P3 (layer 6)
  - [-1, 2, C3k2, [256, True]] # 18 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 15], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, True]] # 21 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 12], 1, Concat, [1]] # cat backbone P5 (layer 12)
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 24 (P5/32-large)

  - [[18, 21, 24], 1, Detect, [nc]] # Detect(P3, P4, P5)

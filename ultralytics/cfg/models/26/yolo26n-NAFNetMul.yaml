# YOLO26n-NAFNetMul: multiplicative-residual NAFNet denoising + YOLO26 backbone
#
# For multiplicative speckle noise (I_noise = I_clean * N), a multiplicative residual
#   output = x * exp(-f(x))
# matches the noise model better than the additive residual output = x - f(x).
# exp(-f(x)) estimates 1/N and is always positive; f(x)=0 gives the identity mapping.

# Parameters
nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]

# YOLO26n-NAFNetMul backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, NAFNetMul, [3, 16, 2]] # 0-multiplicative-residual NAFBlock×2 denoising
  - [-1, 1, Conv, [64, 3, 2]]      # 1-P1/2
  - [-1, 1, Conv, [128, 3, 2]]     # 2-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]     # 4-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]     # 6-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]    # 8-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 10
  - [-1, 2, C2PSA, [1024]]         # 11

# YOLO26n-NAFNetMul head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 7], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]] # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]] # 17 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]] # 20 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 23 (P5/32-large)

  - [[17, 20, 23], 1, Detect, [nc]] # Detect(P3, P4, P5)

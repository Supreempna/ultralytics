# YOLO26n-SpeckleNoise: plain YOLO26n with a front-end speckle-noise injector (NO NAFNet).
#
# This is the control for the "noise pre-training without denoiser" ablation (Q1):
#   Stage-1:  SpeckleNoise (synthetic degradation) → standard YOLO26n backbone → head
#   Stage-2:  remove SpeckleNoise (plain yolo26.yaml) and fine-tune
#
# Purpose: isolate whether the two-stage noise strategy helps by itself (noise
# augmentation of the backbone) or only through NAFNet + the noise-residual
# consistency loss. There is no denoiser here, so the noise loss is inactive.

# Parameters
nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants, i.e. 'model=yolo26n-SpeckleNoise.yaml' will call with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]

# YOLO26n-SpeckleNoise backbone (SpeckleNoise + standard YOLO26n)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, SpeckleNoise, [3, 1, False, 0.0]] # 0-speckle: c2=3, L=1, no additive noise
  - [-1, 1, Conv, [64, 3, 2]]                  # 1-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                 # 2-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]          # 3
  - [-1, 1, Conv, [256, 3, 2]]                 # 4-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]          # 5
  - [-1, 1, Conv, [512, 3, 2]]                 # 6-P4/16
  - [-1, 2, C3k2, [512, True]]                 # 7
  - [-1, 1, Conv, [1024, 3, 2]]                # 8-P5/32
  - [-1, 2, C3k2, [1024, True]]                # 9
  - [-1, 1, SPPF, [1024, 5, 3, True]]          # 10
  - [-1, 2, C2PSA, [1024]]                     # 11

# YOLO26n-SpeckleNoise head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 12
  - [[-1, 7], 1, Concat, [1]] # cat backbone P4 (layer 7)
  - [-1, 2, C3k2, [512, True]] # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 15
  - [[-1, 5], 1, Concat, [1]] # cat backbone P3 (layer 5)
  - [-1, 2, C3k2, [256, True]] # 17 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                  # 18
  - [[-1, 14], 1, Concat, [1]] # cat head P4 (layer 14)
  - [-1, 2, C3k2, [512, True]] # 20 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                  # 21
  - [[-1, 11], 1, Concat, [1]] # cat head P5 (layer 11)
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 23 (P5/32-large)

  - [[17, 20, 23], 1, Detect, [nc]] # Detect(P3, P4, P5)
